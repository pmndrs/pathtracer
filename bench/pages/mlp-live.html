<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MLP live</title>
    <style>
      :root { color-scheme: dark; --bg: #111316; --panel: #1b1e23; --text: #e6e8eb; --muted: #9aa1ab; --accent: #6cb6ff; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
      header { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; padding: 12px 16px; background: var(--panel); }
      header h1 { font-size: 15px; margin: 0 8px 0 0; }
      label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
      select, input, button { font: inherit; color: var(--text); background: #262a31; border: 1px solid #353a43; border-radius: 4px; padding: 3px 6px; }
      button { cursor: pointer; }
      button.primary { border-color: var(--accent); }
      main { padding: 16px; }
      canvas { width: 100%; max-width: 1024px; image-rendering: pixelated; display: block; border-radius: 4px; }
      .captions { display: flex; max-width: 1024px; color: var(--muted); margin-top: 6px; }
      .captions span { flex: 1; }
      #stats { margin-top: 12px; font-variant-numeric: tabular-nums; white-space: pre-wrap; color: var(--muted); }
      #error { color: #ff7b72; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <header>
      <h1>MLP live: learning an HDR image</h1>
      <label>Backend <select id="backend"></select></label>
      <label>Steps / frame <select id="steps"><option>1</option><option selected>2</option><option>4</option><option>8</option></select></label>
      <label>Batch <select id="batch"><option>4096</option><option selected>16384</option></select></label>
      <label>LR <input id="lr" type="number" value="0.01" step="0.001" min="0.0001" style="width: 6em" /></label>
      <label><input id="ema" type="checkbox" /> EMA</label>
      <label>View <select id="view"><option value="0">image</option><option value="1">relative error</option></select></label>
      <label>Exposure <input id="exposure" type="range" min="-4" max="4" step="0.25" value="0" /></label>
      <button id="reset">Reset</button>
      <button id="bench" class="primary">Benchmark</button>
    </header>
    <main>
      <canvas id="canvas"></canvas>
      <div class="captions"><span>target</span><span>network</span></div>
      <div id="stats"></div>
      <div id="error"></div>
    </main>
    <script type="module" src="./mlp-live.ts"></script>
  </body>
</html>
