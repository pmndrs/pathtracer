<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bindless check</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1b1f; --mute:#6b6b76; --line:#d9d9e0; --ok:#17803d; --bad:#c62828; --warn:#b26a00; --chip:#f1f1f5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16161a; --fg:#e8e8ee; --mute:#9a9aa8; --line:#33333b; --ok:#4cc27a; --bad:#ff6b6b; --warn:#f0b050; --chip:#24242b; } }
  body { margin: 0 auto; padding: 16px; max-width: 980px; background: var(--bg); color: var(--fg); font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 24px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .05em; color: var(--mute); }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: 3px 10px 3px 0; vertical-align: top; border-bottom: 1px solid var(--line); word-break: break-word; }
  th { color: var(--mute); font-weight: normal; width: 260px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .mute { color: var(--mute); }
  .tier { font-size: 28px; font-weight: bold; }
  .chip { display: inline-block; background: var(--chip); border-radius: 4px; padding: 1px 6px; margin: 2px 4px 2px 0; }
  pre { background: var(--chip); padding: 8px; overflow: auto; white-space: pre-wrap; margin: 4px 0 0; }
  @media (max-width: 600px) { th { width: 160px; } }
</style>
</head>
<body>
<h1>bindless check</h1>
<div id="out" class="mute">detecting...</div>
<script type="module" src="./bindless-check.ts"></script>
</body>
</html>
